<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý công việc cá nhân</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="container">
        <h1>Quản lý công việc cá nhân</h1>

        <div class="top-bar">
            <button id="btnOpenForm">+ Thêm công việc</button>
        </div>

        <div id="message"></div>

        <div class="statistics">
            <div>
                <strong>Tổng công việc:</strong>
                <span id="totalTasks">0</span>
            </div>

            <div>
                <strong>Đã hoàn thành:</strong>
                <span id="completedTasks">0</span>
            </div>

            <div>
                <strong>Chưa hoàn thành:</strong>
                <span id="uncompletedTasks">0</span>
            </div>
        </div>

        <div id="taskList" class="task-list">
            <!-- Danh sách công việc sẽ được render bằng JavaScript -->
        </div>
    </div>

    <!-- Popup form -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h2 id="formTitle">Thêm công việc</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Tiêu đề công việc</label>
                    <input type="text" id="taskTitle" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Mô tả ngắn</label>
                    <textarea id="taskDescription" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="deadline">Hạn hoàn thành</label>
                    <input type="date" id="deadline" required>
                </div>

                <div class="form-group">
                    <label for="priority">Mức ưu tiên</label>
                    <select id="priority" required>
                        <option value="">-- Chọn mức ưu tiên --</option>
                        <option value="Cao">Cao</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Thấp">Thấp</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="isCompleted">
                    <label for="isCompleted">Đã hoàn thành</label>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btnSave">Lưu</button>
                    <button type="button" id="btnCloseForm">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
