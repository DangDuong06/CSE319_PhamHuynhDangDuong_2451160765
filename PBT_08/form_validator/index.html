<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B3 - Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="form-card">
            <h1>Đăng ký tài khoản</h1>
            <p class="subtitle">Validate form real-time bằng Vanilla JavaScript</p>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Họ tên</label>
                    <div class="input-wrap">
                        <input id="fullName" name="fullName" type="text" placeholder="Nhập họ tên">
                        <span id="nameIcon" class="status-icon">○</span>
                    </div>
                    <small id="nameError" class="message">Tên phải có từ 2 đến 50 ký tự.</small>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <input id="email" name="email" type="email" placeholder="example@gmail.com">
                        <span id="emailIcon" class="status-icon">○</span>
                    </div>
                    <small id="emailError" class="message">Email không được để trống.</small>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrap">
                        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu">
                        <span id="passwordIcon" class="status-icon">○</span>
                    </div>
                    <div class="strength-box">
                        <div id="strengthBar" class="strength-bar"></div>
                    </div>
                    <small id="passwordError" class="message">Mật khẩu tối thiểu 8 ký tự.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <div class="input-wrap">
                        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu">
                        <span id="confirmIcon" class="status-icon">○</span>
                    </div>
                    <small id="confirmError" class="message">Vui lòng nhập lại mật khẩu.</small>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <div class="input-wrap">
                        <input id="phone" name="phone" type="text" placeholder="0901-234-567" maxlength="12">
                        <span id="phoneIcon" class="status-icon">○</span>
                    </div>
                    <small id="phoneError" class="message">Số điện thoại phải gồm đúng 10 chữ số.</small>
                </div>

                <button id="submitBtn" type="submit" disabled>Đăng ký</button>
            </form>
        </section>
    </main>

    <div id="successModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button id="closeModal" class="close-btn" type="button" aria-label="Đóng modal">×</button>
            <h2 id="modalTitle">Đăng ký thành công!</h2>
            <div id="modalInfo" class="modal-info"></div>
            <button id="okBtn" type="button" class="ok-btn">OK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
